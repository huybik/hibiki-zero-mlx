[project]
name = "hibiki-mlx"
version = "0.1.0"
description = "Realtime MLX speech-translation runtime for hibiki-zero (q4, pipelined)."
requires-python = ">= 3.10,<3.14"
readme = "README.md"
dependencies = [
    # moshi_mlx comes from the vendored fork: pip install -e ./moshi-mlx
    "mlx>=0.26.0",
    "numpy",
    "rustymimi>=0.4.1",
    "sentencepiece",
    "sounddevice>=0.5.0",
    "sphn>=0.2.0",
]

[tool.ruff]
line-length = 100

[project.optional-dependencies]
training = [
    "datasets",
    "huggingface-hub",
    "pyarrow",
    "sacrebleu",
    "safetensors",
    "soundfile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hibiki_mlx"]
