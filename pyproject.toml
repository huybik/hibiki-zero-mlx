[project]
name = "hibiki-zero"
requires-python = ">= 3.10,<3.14"
description = "Simultaneous Speech-to-Speech Translation Without Aligned Data."
version = "0.0.4"
readme = "README.md"
dependencies = [
    # TODO: use the public release of moshi when it's been published
    "moshi>=0.2.13",
    "gradio>=5.50.0",
    "jupyter>=1.1.1",
    "datasets>=2.19.0",
    "vieneu>=3.0.9",
    "kokoro>=0.9.2",
    "soundfile>=0.14.0",
    "onnxruntime<1.24",
    "torch==2.9.1",
    "en-core-web-sm",
]

[tool.setuptools.dynamic]
version = {attr = "hibiki_zero.__version__"}

[tool.ruff]
line-length = 100

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff.format]
line-ending = "lf"
# avoid having a trailing comma changing 
# the behavior of the formatter
skip-magic-trailing-comma = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hibiki_zero"]
artifacts = [
    "hibiki_zero/samples/**",
    "hibiki_zero/static/**",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
hibiki-zero = "hibiki_zero.run:cli_app"

[tool.uv]
# System python distribution can have header files missing, so we use only the python
# distributions provided by uv which have everything included.
python-preference = "only-managed"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
