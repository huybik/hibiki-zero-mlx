<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">Animated Hibiki-Zero LoRA training loop</title>
  <desc id="desc">Vietnamese and English audio are cached into tokens, passed through the frozen base model with trainable LoRA adapters, then evaluated and repeated.</desc>
  <style>
    :root {
      --ink: #16202a;
      --muted: #63707d;
      --paper: #fbfcfd;
      --line: #b8c3cc;
      --vi: #1f8a70;
      --en: #b75c2b;
      --cache: #3b6ea8;
      --model: #6b5ca5;
      --lora: #c43f61;
      --eval: #776b16;
    }

    .bg { fill: var(--paper); }
    .box { fill: white; stroke: var(--line); stroke-width: 1.5; rx: 8; }
    .title { font: 700 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
    .label { font: 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
    .small { font: 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    .path { fill: none; stroke: #77838f; stroke-width: 3; stroke-dasharray: 10 10; animation: dash 1.8s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    .adapter { animation: glow 1.8s ease-in-out infinite; }
    .tick { animation: tick 1.8s ease-in-out infinite; }

    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.65; stroke-width: 2; }
      50% { opacity: 1; stroke-width: 4; }
    }
    @keyframes tick {
      0%, 35% { opacity: 0.25; }
      50%, 100% { opacity: 1; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c3cc"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="330"/>

  <rect class="box" x="35" y="48" width="150" height="92"/>
  <text class="title" x="55" y="82">FLEURS pair</text>
  <text class="label" x="55" y="108">vi source audio</text>
  <text class="label" x="55" y="128">en target audio/text</text>
  <circle class="pulse" cx="157" cy="75" r="9" fill="var(--vi)"/>
  <circle class="pulse" cx="171" cy="98" r="9" fill="var(--en)" style="animation-delay: .25s"/>

  <path class="arrow" d="M 185 94 C 215 94 225 94 255 94"/>

  <rect class="box" x="255" y="48" width="165" height="92"/>
  <text class="title" x="277" y="82">Code cache</text>
  <text class="label" x="277" y="108">Mimi codes + text ids</text>
  <text class="small" x="277" y="128">codes[33, T]</text>
  <path class="path" d="M 276 58 H 399"/>

  <path class="arrow" d="M 420 94 C 455 94 465 94 500 94"/>

  <rect class="box" x="500" y="35" width="210" height="118"/>
  <text class="title" x="522" y="70">Frozen Hibiki LM</text>
  <text class="label" x="522" y="96">main transformer forward</text>
  <text class="label" x="522" y="118">depformer predicts audio</text>
  <text class="label" x="522" y="140">text head predicts English</text>
  <rect class="adapter" x="647" y="52" width="42" height="84" rx="6" fill="none" stroke="var(--lora)" stroke-width="2"/>
  <text class="small" x="654" y="100" fill="var(--lora)">LoRA</text>

  <path class="arrow" d="M 710 94 C 745 94 755 94 790 94"/>

  <rect class="box" x="790" y="48" width="155" height="92"/>
  <text class="title" x="815" y="82">Loss</text>
  <text class="label" x="815" y="108">audio CE + text CE</text>
  <text class="small" x="815" y="128">masked valid tokens only</text>
  <circle class="tick" cx="920" cy="75" r="8" fill="var(--eval)"/>

  <path class="arrow" d="M 870 140 C 870 214 684 238 616 169"/>
  <text class="small" x="687" y="231">backprop updates only LoRA tensors</text>

  <rect class="box" x="160" y="210" width="185" height="72"/>
  <text class="title" x="182" y="242">Adapter file</text>
  <text class="label" x="182" y="264">adapter_step000005.safetensors</text>
  <path class="arrow" d="M 790 123 C 625 260 444 247 345 247"/>

  <rect class="box" x="458" y="220" width="210" height="72"/>
  <text class="title" x="481" y="252">Validation generation</text>
  <text class="label" x="481" y="274">wav/txt + predictions.csv</text>
  <path class="arrow" d="M 345 247 C 390 247 410 247 458 247"/>

  <text class="small" x="45" y="312">The full model stays frozen. Training repeatedly turns cached tokens into loss, then nudges the small LoRA adapter.</text>
</svg>
