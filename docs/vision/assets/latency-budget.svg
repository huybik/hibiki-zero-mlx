<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161C33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg5)"/>
  <text x="600" y="48" font-size="26" font-weight="700" text-anchor="middle" fill="#E5E7EB">The 80 ms frame budget</text>
  <text x="600" y="78" font-size="14" text-anchor="middle" fill="#94A3B8">The model emits one 12.5 Hz frame every 80 ms. To stay real-time, all per-frame work must fit inside it.</text>

  <!-- budget bar -->
  <g transform="translate(150,150)">
    <text x="-20" y="34" font-size="14" text-anchor="end" fill="#94A3B8">Budget</text>
    <rect x="0" y="10" width="900" height="44" rx="8" fill="#11182E" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="900" y="38" font-size="14" fill="#6EE7B7" dx="12">80 ms / frame</text>
  </g>

  <!-- M4 today -->
  <g transform="translate(150,230)">
    <text x="-20" y="30" font-size="14" text-anchor="end" fill="#94A3B8">M4 Pro</text>
    <!-- main transformer 8.6ms -> width 96.75 -->
    <rect x="0" y="6" width="97" height="44" rx="8" fill="#6366F1"/>
    <text x="48" y="34" font-size="12" text-anchor="middle" fill="#fff">main</text>
    <!-- depformer 15.7ms -> width 176.6 -->
    <rect x="97" y="6" width="177" height="44" fill="#F472B6"/>
    <text x="185" y="34" font-size="12" text-anchor="middle" fill="#fff">depformer 64%</text>
    <!-- codec hidden -->
    <rect x="274" y="6" width="60" height="44" rx="8" fill="#22D3EE" opacity="0.4"/>
    <text x="304" y="30" font-size="10" text-anchor="middle" fill="#cffafe">codec</text>
    <text x="304" y="44" font-size="9" text-anchor="middle" fill="#cffafe">(hidden)</text>
    <text x="360" y="34" font-size="13" fill="#94A3B8">≈ 24 ms LM → 3× real-time ✓</text>
  </g>

  <!-- Phone target -->
  <g transform="translate(150,310)">
    <text x="-20" y="30" font-size="14" text-anchor="end" fill="#94A3B8">Phone NPU</text>
    <rect x="0" y="6" width="60" height="44" rx="8" fill="#6366F1"/>
    <text x="30" y="34" font-size="11" text-anchor="middle" fill="#fff">main</text>
    <!-- parallel codebook head, much smaller -->
    <rect x="60" y="6" width="55" height="44" fill="#34D399"/>
    <text x="88" y="30" font-size="10" text-anchor="middle" fill="#06281c">parallel</text>
    <text x="88" y="44" font-size="10" text-anchor="middle" fill="#06281c">head</text>
    <rect x="115" y="6" width="40" height="44" rx="8" fill="#22D3EE" opacity="0.4"/>
    <text x="135" y="34" font-size="9" text-anchor="middle" fill="#cffafe">codec</text>
    <text x="190" y="34" font-size="13" fill="#6EE7B7">restructured + distilled → fits with headroom ✓</text>
  </g>

  <!-- legend / note -->
  <g transform="translate(150,400)">
    <rect x="0" y="0" width="900" height="56" rx="12" fill="#11182E" stroke="#1F2A4A"/>
    <text x="20" y="24" font-size="13" fill="#E5E7EB">Key insight: the depformer's 16 sequential codebook passes (~370 kernel launches/frame) are launch-bound —</text>
    <text x="20" y="44" font-size="13" fill="#94A3B8">quantization alone won't speed them up. A parallel-codebook head removes the serial passes outright.</text>
  </g>
</svg>
