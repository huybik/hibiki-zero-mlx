<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161C33"/>
    </linearGradient>
    <linearGradient id="line7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg7)"/>
  <text x="600" y="50" font-size="26" font-weight="700" text-anchor="middle" fill="#E5E7EB">The road to a phone in everyone's pocket</text>

  <!-- timeline -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="url(#line7)" stroke-width="5" stroke-linecap="round"/>

  <!-- milestone template -->
  <!-- M0 done -->
  <g transform="translate(160,230)">
    <circle r="13" fill="#34D399" stroke="#0B1020" stroke-width="3"/>
    <text x="0" y="5" font-size="13" text-anchor="middle" fill="#06281c">✓</text>
    <g transform="translate(0,-150)">
      <rect x="-95" y="0" width="190" height="120" rx="12" fill="#161C33" stroke="#34D399" stroke-width="1.5"/>
      <text x="0" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#6EE7B7">0 · Mac runtime</text>
      <text x="0" y="52" font-size="11.5" text-anchor="middle" fill="#94A3B8">MLX 4-bit, 3× RT on M4</text>
      <text x="0" y="72" font-size="11.5" text-anchor="middle" fill="#94A3B8">codec pipeline + depformer</text>
      <text x="0" y="92" font-size="11.5" text-anchor="middle" fill="#94A3B8">CoVoST BLEU 25.7</text>
      <text x="0" y="111" font-size="11" text-anchor="middle" fill="#6EE7B7">DONE</text>
    </g>
  </g>

  <!-- M1 -->
  <g transform="translate(395,230)">
    <circle r="13" fill="#22D3EE" stroke="#0B1020" stroke-width="3"/>
    <g transform="translate(0,50)">
      <rect x="-95" y="0" width="190" height="120" rx="12" fill="#161C33" stroke="#22D3EE" stroke-width="1.5"/>
      <text x="0" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#67E8F9">1 · Vietnamese</text>
      <text x="0" y="52" font-size="11.5" text-anchor="middle" fill="#94A3B8">10h LoRA water-test ✓</text>
      <text x="0" y="72" font-size="11.5" text-anchor="middle" fill="#94A3B8">then full 3B FT upstream</text>
      <text x="0" y="92" font-size="11.5" text-anchor="middle" fill="#94A3B8">VI→EN + retention gate</text>
      <text x="0" y="111" font-size="11" text-anchor="middle" fill="#67E8F9">Track A</text>
    </g>
  </g>

  <!-- M2 -->
  <g transform="translate(630,230)">
    <circle r="13" fill="#6366F1" stroke="#0B1020" stroke-width="3"/>
    <g transform="translate(0,-150)">
      <rect x="-95" y="0" width="190" height="120" rx="12" fill="#161C33" stroke="#6366F1" stroke-width="1.5"/>
      <text x="0" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#A5B4FC">2 · Parallel head</text>
      <text x="0" y="52" font-size="11.5" text-anchor="middle" fill="#94A3B8">self-distill, frozen main</text>
      <text x="0" y="72" font-size="11.5" text-anchor="middle" fill="#94A3B8">16 steps → 1–4 passes</text>
      <text x="0" y="92" font-size="11.5" text-anchor="middle" fill="#94A3B8">kills the 64% bottleneck</text>
      <text x="0" y="111" font-size="11" text-anchor="middle" fill="#A5B4FC">Track B</text>
    </g>
  </g>

  <!-- M3 -->
  <g transform="translate(865,230)">
    <circle r="13" fill="#A78BFA" stroke="#0B1020" stroke-width="3"/>
    <g transform="translate(0,50)">
      <rect x="-95" y="0" width="190" height="120" rx="12" fill="#161C33" stroke="#A78BFA" stroke-width="1.5"/>
      <text x="0" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#C4B5FD">3 · On-device app</text>
      <text x="0" y="52" font-size="11.5" text-anchor="middle" fill="#94A3B8">iOS (ANE) + Android (NPU)</text>
      <text x="0" y="72" font-size="11.5" text-anchor="middle" fill="#94A3B8">native, no cloud</text>
      <text x="0" y="92" font-size="11.5" text-anchor="middle" fill="#94A3B8">BLE earbud, low latency</text>
      <text x="0" y="111" font-size="11" text-anchor="middle" fill="#C4B5FD">Product</text>
    </g>
  </g>

  <!-- M4 -->
  <g transform="translate(1080,230)">
    <circle r="13" fill="#34D399" stroke="#0B1020" stroke-width="3"/>
    <g transform="translate(-10,-150)">
      <rect x="-95" y="0" width="180" height="120" rx="12" fill="#161C33" stroke="#34D399" stroke-width="1.5"/>
      <text x="-5" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#6EE7B7">4 · Scale</text>
      <text x="-5" y="52" font-size="11.5" text-anchor="middle" fill="#94A3B8">more languages</text>
      <text x="-5" y="72" font-size="11.5" text-anchor="middle" fill="#94A3B8">re-run B per language</text>
      <text x="-5" y="92" font-size="11.5" text-anchor="middle" fill="#94A3B8">world-wide</text>
      <text x="-5" y="111" font-size="11" text-anchor="middle" fill="#6EE7B7">Mission</text>
    </g>
  </g>

  <text x="600" y="430" font-size="13" text-anchor="middle" fill="#64748B">Sequential by design — commit and measure at each milestone (silence-in · ASR-BLEU · speed gates).</text>
</svg>
