<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#10162B"/>
    </linearGradient>
    <marker id="a6" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg6)"/>
  <text x="600" y="46" font-size="26" font-weight="700" text-anchor="middle" fill="#E5E7EB">Two tracks, run A → B</text>
  <text x="600" y="74" font-size="14" text-anchor="middle" fill="#94A3B8">Add the language first (it moves the weights), then distill the fast head against that new, stable base.</text>

  <!-- base -->
  <g transform="translate(60,250)">
    <rect x="0" y="-55" width="150" height="110" rx="14" fill="#11182E" stroke="#88A" stroke-width="1.5"/>
    <text x="75" y="-22" font-size="14" font-weight="700" text-anchor="middle" fill="#C7D2FE">Hibiki-Zero</text>
    <text x="75" y="2" font-size="11.5" text-anchor="middle" fill="#94A3B8">FR/ES/PT/DE → EN</text>
    <text x="75" y="22" font-size="11.5" text-anchor="middle" fill="#94A3B8">AR depformer</text>
    <text x="75" y="42" font-size="11.5" text-anchor="middle" fill="#94A3B8">16 serial steps</text>
  </g>
  <path d="M210 250 H 260" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a6)"/>

  <!-- Track A -->
  <g transform="translate(265,150)">
    <rect width="330" height="240" rx="18" fill="#1B1306" stroke="#C88200" stroke-width="2"/>
    <text x="165" y="34" font-size="17" font-weight="800" text-anchor="middle" fill="#FBBF24">TRACK A — add Vietnamese</text>
    <text x="165" y="56" font-size="12" text-anchor="middle" fill="#D6B98C">supervised fine-tune · upstream · GPU</text>

    <g transform="translate(24,76)">
      <rect width="282" height="44" rx="10" fill="#0B1020" stroke="#C88200" stroke-width="1"/>
      <text x="141" y="20" font-size="12" text-anchor="middle" fill="#FCD9A0">Build Vi→EN pairs</text>
      <text x="141" y="36" font-size="11" text-anchor="middle" fill="#94A3B8">VietBud500 · Whisper · MADLAD/NLLB · TTS</text>
    </g>
    <g transform="translate(24,130)">
      <rect width="282" height="44" rx="10" fill="#0B1020" stroke="#C88200" stroke-width="1"/>
      <text x="141" y="20" font-size="12" text-anchor="middle" fill="#FCD9A0">Fine-tune 3B main (+ RL)</text>
      <text x="141" y="36" font-size="11" text-anchor="middle" fill="#94A3B8">un-freezes weights · keep old langs (retention gate)</text>
    </g>
    <g transform="translate(24,184)">
      <rect width="282" height="40" rx="10" fill="#0B1020" stroke="#22D3EE" stroke-width="1"/>
      <text x="141" y="25" font-size="11.5" text-anchor="middle" fill="#67E8F9">Mac water-test: LoRA-on-main, 10h, Mimi-cached</text>
    </g>
  </g>

  <!-- new base -->
  <g transform="translate(610,250)">
    <rect x="0" y="-55" width="150" height="110" rx="14" fill="#11182E" stroke="#6366F1" stroke-width="2"/>
    <text x="75" y="-22" font-size="14" font-weight="700" text-anchor="middle" fill="#A5B4FC">NEW base</text>
    <text x="75" y="2" font-size="11.5" text-anchor="middle" fill="#94A3B8">+ VI → EN</text>
    <text x="75" y="22" font-size="11.5" text-anchor="middle" fill="#94A3B8">5 languages</text>
    <text x="75" y="42" font-size="11.5" text-anchor="middle" fill="#94A3B8">stable, frozen</text>
  </g>
  <path d="M595 250 H 605" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a6)"/>
  <path d="M760 250 H 810" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a6)"/>

  <!-- Track B -->
  <g transform="translate(815,150)">
    <rect width="330" height="240" rx="18" fill="#06170D" stroke="#0A9D54" stroke-width="2"/>
    <text x="165" y="34" font-size="17" font-weight="800" text-anchor="middle" fill="#6EE7B7">TRACK B — parallel head</text>
    <text x="165" y="56" font-size="12" text-anchor="middle" fill="#9DE9C3">self-distill · MLX on M4 · this repo</text>

    <g transform="translate(24,76)">
      <rect width="282" height="44" rx="10" fill="#0B1020" stroke="#0A9D54" stroke-width="1"/>
      <text x="141" y="20" font-size="12" text-anchor="middle" fill="#A7F3D0">Teacher dump (inference only)</text>
      <text x="141" y="36" font-size="11" text-anchor="middle" fill="#94A3B8">cache transformer_out + text + 16 cb logits</text>
    </g>
    <g transform="translate(24,130)">
      <rect width="282" height="44" rx="10" fill="#0B1020" stroke="#0A9D54" stroke-width="1"/>
      <text x="141" y="20" font-size="12" text-anchor="middle" fill="#A7F3D0">Train parallel head (KL + CE)</text>
      <text x="141" y="36" font-size="11" text-anchor="middle" fill="#94A3B8">16 serial passes → 1–4 · main stays frozen</text>
    </g>
    <g transform="translate(24,184)">
      <rect width="282" height="40" rx="10" fill="#0B1020" stroke="#34D399" stroke-width="1"/>
      <text x="141" y="25" font-size="11.5" text-anchor="middle" fill="#6EE7B7">Re-quantize q4 · silence-in + ASR-BLEU gates</text>
    </g>
  </g>

  <!-- ship -->
  <g transform="translate(1000,450)">
    <text x="0" y="0" font-size="14" text-anchor="middle" fill="#6EE7B7" font-weight="700">→ fast + multilingual · iPhone-ready</text>
  </g>
  <text x="200" y="455" font-size="12.5" fill="#94A3B8">Rule: whenever the main changes (any new language), re-run Track B — it's the cheap, frozen-teacher half.</text>
</svg>
