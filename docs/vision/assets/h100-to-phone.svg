<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161C33"/>
    </linearGradient>
    <linearGradient id="shrink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg3)"/>
  <text x="600" y="52" font-size="26" font-weight="700" text-anchor="middle" fill="#E5E7EB">From a data-center GPU to your pocket</text>

  <!-- big arrow -->
  <path d="M120 250 H 1080" stroke="url(#shrink)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <polygon points="1080,236 1110,250 1080,264" fill="#34D399"/>

  <!-- Stage 1: H100 -->
  <g transform="translate(120,250)">
    <rect x="-10" y="-150" width="220" height="110" rx="14" fill="#161C33" stroke="#F472B6" stroke-width="1.5"/>
    <text x="100" y="-118" font-size="18" font-weight="700" text-anchor="middle" fill="#F9A8D4">NVIDIA H100</text>
    <text x="100" y="-92" font-size="13" text-anchor="middle" fill="#94A3B8">3B params · bf16</text>
    <text x="100" y="-72" font-size="13" text-anchor="middle" fill="#94A3B8">5.8 GB · 80 GB VRAM</text>
    <text x="100" y="-52" font-size="13" text-anchor="middle" fill="#34D399">~3× real-time</text>
    <circle cx="100" cy="0" r="9" fill="#F472B6"/>
    <text x="100" y="46" font-size="13" text-anchor="middle" fill="#94A3B8">Upstream baseline</text>
  </g>

  <!-- Stage 2: Apple Silicon MLX q4 (today) -->
  <g transform="translate(490,250)">
    <rect x="-10" y="40" width="220" height="120" rx="14" fill="#161C33" stroke="#6366F1" stroke-width="1.5"/>
    <text x="100" y="72" font-size="18" font-weight="700" text-anchor="middle" fill="#A5B4FC">Apple Silicon · MLX</text>
    <text x="100" y="98" font-size="13" text-anchor="middle" fill="#94A3B8">4-bit quant · 2.2 GB</text>
    <text x="100" y="118" font-size="13" text-anchor="middle" fill="#94A3B8">3-thread codec pipeline</text>
    <text x="100" y="138" font-size="13" text-anchor="middle" fill="#34D399">~3× real-time on M4 Pro</text>
    <circle cx="100" cy="0" r="9" fill="#6366F1"/>
    <text x="100" y="-22" font-size="13" font-weight="700" text-anchor="middle" fill="#A5B4FC">TODAY ✓</text>
  </g>

  <!-- Stage 3: Phone -->
  <g transform="translate(860,250)">
    <rect x="-10" y="-150" width="220" height="110" rx="14" fill="#161C33" stroke="#34D399" stroke-width="1.5"/>
    <text x="100" y="-118" font-size="18" font-weight="700" text-anchor="middle" fill="#6EE7B7">iPhone / Android NPU</text>
    <text x="100" y="-92" font-size="13" text-anchor="middle" fill="#94A3B8">distilled + restructured</text>
    <text x="100" y="-72" font-size="13" text-anchor="middle" fill="#94A3B8">~0.5–1 GB · low-bit</text>
    <text x="100" y="-52" font-size="13" text-anchor="middle" fill="#34D399">real-time @ 80 ms/frame</text>
    <circle cx="100" cy="0" r="9" fill="#34D399"/>
    <text x="100" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="#6EE7B7">THE GOAL</text>
  </g>

  <text x="600" y="450" font-size="14" text-anchor="middle" fill="#94A3B8">Each step: smaller weights, fewer sequential kernel launches, same conversation quality.</text>
</svg>
