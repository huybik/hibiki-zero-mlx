<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hibiki-Zero MLX streaming architecture</title>
  <desc id="desc">Source audio passes through a CPU encoder, GPU main transformer and codebook head, then a CPU decoder. Ordered NumPy queues connect three state-owning threads.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7e5ff"/><stop offset="1" stop-color="#d8f8f3"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#50608a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b2c55" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#fbfcff"/>
  <text x="60" y="62" fill="#18213d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">One 80 ms frame, three owners</text>
  <text x="60" y="92" fill="#66708b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17">The speedup comes from overlap without crossing mutable state or lazy-graph boundaries.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="260" height="310" rx="24" fill="url(#panel)" stroke="#b9c8ef"/>
    <rect x="470" y="125" width="420" height="350" rx="26" fill="url(#gpu)" stroke="#9fa7ea" stroke-width="2"/>
    <rect x="1040" y="145" width="105" height="310" rx="24" fill="url(#panel)" stroke="#b9c8ef"/>
  </g>

  <text x="185" y="185" text-anchor="middle" fill="#52618a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CPU / ENCODER THREAD</text>
  <circle cx="185" cy="250" r="45" fill="#d9f3ff" stroke="#61bde7" stroke-width="2"/>
  <path d="M153 251 C160 251 160 230 168 230 S176 272 184 272 192 220 200 220 208 263 216 263" fill="none" stroke="#238fbf" stroke-width="4" stroke-linecap="round"/>
  <text x="185" y="330" text-anchor="middle" fill="#1e2948" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">Mimi encode</text>
  <text x="185" y="360" text-anchor="middle" fill="#62708f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15">PCM -> source codebooks</text>
  <text x="185" y="400" text-anchor="middle" fill="#31516f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">owns codec state</text>
  <text x="185" y="423" text-anchor="middle" fill="#31516f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">rustymimi instance #1</text>

  <text x="680" y="165" text-anchor="middle" fill="#4d4a8f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GPU / MAIN THREAD</text>
  <rect x="515" y="205" width="330" height="92" rx="18" fill="#ffffff" fill-opacity="0.78" stroke="#9ba3e5"/>
  <text x="680" y="242" text-anchor="middle" fill="#1d2446" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Main Transformer</text>
  <text x="680" y="270" text-anchor="middle" fill="#5f6687" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15">KV cache + source + generated feedback</text>
  <rect x="515" y="325" width="155" height="92" rx="18" fill="#ffffff" fill-opacity="0.78" stroke="#a59ee8"/>
  <rect x="690" y="325" width="155" height="92" rx="18" fill="#ffffff" fill-opacity="0.78" stroke="#61bda9"/>
  <text x="592" y="362" text-anchor="middle" fill="#292653" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750">Text head</text>
  <text x="592" y="389" text-anchor="middle" fill="#68668b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">English tokens</text>
  <text x="767" y="362" text-anchor="middle" fill="#184d45" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750">Audio head</text>
  <text x="767" y="389" text-anchor="middle" fill="#4c766f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14">AR or parallel</text>

  <text x="1092" y="185" text-anchor="middle" fill="#52618a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">CPU</text>
  <circle cx="1092" cy="250" r="38" fill="#dcf9ee" stroke="#52bd94" stroke-width="2"/>
  <path d="M1067 250h8l7-20 10 42 10-42 8 20h8" fill="none" stroke="#238e6d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1092" y="330" text-anchor="middle" fill="#1e2948" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750">Mimi</text>
  <text x="1092" y="355" text-anchor="middle" fill="#1e2948" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750">decode</text>
  <text x="1092" y="399" text-anchor="middle" fill="#31516f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12">codec state</text>
  <text x="1092" y="420" text-anchor="middle" fill="#31516f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12">instance #2</text>

  <path d="M315 280 H455" fill="none" stroke="#50608a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M890 280 H1022" fill="none" stroke="#50608a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="332" y="235" width="104" height="30" rx="15" fill="#ffffff" stroke="#b7c4e4"/>
  <text x="384" y="255" text-anchor="middle" fill="#53617f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">NumPy queue</text>
  <rect x="904" y="235" width="104" height="30" rx="15" fill="#ffffff" stroke="#b7c4e4"/>
  <text x="956" y="255" text-anchor="middle" fill="#53617f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">NumPy queue</text>

  <path d="M767 417 C760 520 590 540 550 432" fill="none" stroke="#756fd1" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="673" y="538" text-anchor="middle" fill="#625da5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">generated codebooks feed the next frame</text>

  <g transform="translate(55 510)">
    <rect width="255" height="65" rx="16" fill="#e9f7ff"/>
    <text x="18" y="27" fill="#276281" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">Measured M4 stages</text>
    <text x="18" y="48" fill="#52748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">encode ~17 ms • decode ~16 ms</text>
  </g>
  <g transform="translate(890 510)">
    <rect width="255" height="65" rx="16" fill="#e9fbf6"/>
    <text x="18" y="27" fill="#246b58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">Pipeline invariant</text>
    <text x="18" y="48" fill="#4f7b70" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13">critical path = slowest active stage</text>
  </g>
</svg>
