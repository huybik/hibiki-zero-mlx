<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Hibiki-Zero MLX product roadmap</title>
  <desc id="desc">Four gated milestones: finish Vietnamese training, build a desktop application, distil a 1B student and parallel head, then build Apple and Qualcomm mobile applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121831"/><stop offset="1" stop-color="#163f4c"/></linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49c6a8"/><stop offset="1" stop-color="#7de0c7"/></linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7d83ed"/><stop offset="1" stop-color="#afa8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.22"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L10 3z" fill="#8ea2c4"/></marker>
  </defs>
  <rect width="1200" height="610" rx="28" fill="url(#bg)"/>
  <text x="60" y="65" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">From research runtime to pocket translator</text>
  <text x="60" y="96" fill="#bfc9e6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16">Every arrow is a qualification gate, not a calendar promise.</text>

  <g transform="translate(55 150)" filter="url(#shadow)">
    <rect width="245" height="325" rx="24" fill="#ffffff"/>
    <rect width="245" height="12" rx="6" fill="url(#done)"/>
    <circle cx="43" cy="60" r="24" fill="#dff8f1"/><text x="43" y="68" text-anchor="middle" fill="#18816d" font-family="Arial,sans-serif" font-size="22" font-weight="800">A</text>
    <text x="25" y="108" fill="#202944" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Finish Vietnamese</text>
    <text x="25" y="136" fill="#58647f" font-family="Arial,sans-serif" font-size="14">Base-start 3B full SFT</text>
    <line x1="25" y1="157" x2="220" y2="157" stroke="#e4e8f0"/>
    <text x="25" y="190" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• free-running val128</text>
    <text x="25" y="216" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• FLEURS + VIVOS dev</text>
    <text x="25" y="242" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• old-language retention</text>
    <rect x="25" y="272" width="195" height="32" rx="16" fill="#e8f8f4"/>
    <text x="122" y="293" text-anchor="middle" fill="#237361" font-family="Arial,sans-serif" font-size="12" font-weight="750">gate: eligible checkpoint</text>
  </g>

  <path d="M310 312H350" stroke="#8ea2c4" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(360 150)" filter="url(#shadow)">
    <rect width="245" height="325" rx="24" fill="#ffffff"/>
    <rect width="245" height="12" rx="6" fill="url(#next)"/>
    <circle cx="43" cy="60" r="24" fill="#ececff"/><text x="43" y="68" text-anchor="middle" fill="#5b5eb7" font-family="Arial,sans-serif" font-size="22" font-weight="800">B</text>
    <text x="25" y="108" fill="#202944" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Desktop app</text>
    <text x="25" y="136" fill="#58647f" font-family="Arial,sans-serif" font-size="14">Mac prototype -> native Swift</text>
    <line x1="25" y1="157" x2="220" y2="157" stroke="#e4e8f0"/>
    <text x="25" y="190" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• live audio + subtitles</text>
    <text x="25" y="216" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• latency + memory panel</text>
    <text x="25" y="242" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• 30-minute soak test</text>
    <rect x="25" y="272" width="195" height="32" rx="16" fill="#eeefff"/>
    <text x="122" y="293" text-anchor="middle" fill="#5c5fa1" font-family="Arial,sans-serif" font-size="12" font-weight="750">gate: stable conversation</text>
  </g>

  <path d="M615 312H655" stroke="#8ea2c4" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(665 150)" filter="url(#shadow)">
    <rect width="245" height="325" rx="24" fill="#ffffff"/>
    <rect width="245" height="12" rx="6" fill="#e4a15b"/>
    <circle cx="43" cy="60" r="24" fill="#fff1df"/><text x="43" y="68" text-anchor="middle" fill="#9a5d24" font-family="Arial,sans-serif" font-size="22" font-weight="800">C</text>
    <text x="25" y="108" fill="#202944" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Distil for mobile</text>
    <text x="25" y="136" fill="#58647f" font-family="Arial,sans-serif" font-size="14">Size and latency are separate</text>
    <line x1="25" y1="157" x2="220" y2="157" stroke="#e4e8f0"/>
    <text x="25" y="190" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• Vietnamese 1B student</text>
    <text x="25" y="216" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• parallel codebook head</text>
    <text x="25" y="242" fill="#3f4b68" font-family="Arial,sans-serif" font-size="13">• q4 quality curve</text>
    <rect x="25" y="272" width="195" height="32" rx="16" fill="#fff2e5"/>
    <text x="122" y="293" text-anchor="middle" fill="#8c5b2c" font-family="Arial,sans-serif" font-size="12" font-weight="750">gate: teacher parity</text>
  </g>

  <path d="M920 312H960" stroke="#8ea2c4" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(970 150)" filter="url(#shadow)">
    <rect width="175" height="325" rx="24" fill="#ffffff"/>
    <rect width="175" height="12" rx="6" fill="#55afd7"/>
    <circle cx="43" cy="60" r="24" fill="#e4f5fc"/><text x="43" y="68" text-anchor="middle" fill="#347b9b" font-family="Arial,sans-serif" font-size="22" font-weight="800">D</text>
    <text x="25" y="108" fill="#202944" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Mobile apps</text>
    <text x="25" y="136" fill="#58647f" font-family="Arial,sans-serif" font-size="13">Apple + Qualcomm</text>
    <line x1="25" y1="157" x2="150" y2="157" stroke="#e4e8f0"/>
    <text x="25" y="190" fill="#3f4b68" font-family="Arial,sans-serif" font-size="12">• MLX Swift / Core ML</text>
    <text x="25" y="216" fill="#3f4b68" font-family="Arial,sans-serif" font-size="12">• QNN / AI Hub</text>
    <text x="25" y="242" fill="#3f4b68" font-family="Arial,sans-serif" font-size="12">• thermal device matrix</text>
    <rect x="18" y="272" width="139" height="32" rx="16" fill="#e8f6fb"/>
    <text x="87" y="293" text-anchor="middle" fill="#397591" font-family="Arial,sans-serif" font-size="11" font-weight="750">gate: p99 &lt; 80 ms</text>
  </g>

  <rect x="55" y="515" width="1090" height="54" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#a9bbd8" stroke-opacity="0.2"/>
  <text x="600" y="548" text-anchor="middle" fill="#d5def0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15">Cross-cutting gates: speech quality • translation • silence/loops • memory • sustained thermals • license</text>
</svg>
