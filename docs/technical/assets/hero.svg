<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hibiki-Zero MLX technical report cover</title>
  <desc id="desc">A flowing waveform moves through codec, translation model, and voice output stages from MacBook to phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162f"/>
      <stop offset="0.55" stop-color="#202a5a"/>
      <stop offset="1" stop-color="#0d6b72"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
