<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc4cff"/>
      <stop offset="1" stop-color="#db61ff"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="40" y="50" fill="#f0f6fc" font-size="26" font-weight="700">Hibiki-Zero on Apple Silicon — pipelined MLX inference</text>
  <text x="40" y="78" fill="#8b949e" font-size="15">Overlap the CPU codec with the GPU language model · output stays byte-identical</text>

  <!-- SEQUENTIAL -->
  <text x="40" y="128" fill="#f85149" font-size="15" font-weight="700">SEQUENTIAL — CPU and GPU idle on each other (1.35× real-time)</text>
  <g transform="translate(40,142)">
    <rect x="0"   y="0" width="120" height="34" rx="6" fill="url(#cpu)"/>
    <rect x="122" y="0" width="80"  height="34" rx="6" fill="url(#gpu)"/>
    <rect x="204" y="0" width="80"  height="34" rx="6" fill="url(#gpu)" opacity="0.7"/>
    <rect x="286" y="0" width="112" height="34" rx="6" fill="url(#cpu)"/>
    <rect x="400" y="0" width="120" height="34" rx="6" fill="url(#cpu)" opacity="0.4"/>
    <rect x="522" y="0" width="80"  height="34" rx="6" fill="url(#gpu)" opacity="0.4"/>
    <text x="60"  y="22" fill="#fff" font-size="11" text-anchor="middle">mimi enc</text>
    <text x="162" y="22" fill="#fff" font-size="11" text-anchor="middle">LM</text>
    <text x="244" y="22" fill="#fff" font-size="11" text-anchor="middle">depf</text>
    <text x="342" y="22" fill="#fff" font-size="11" text-anchor="middle">mimi dec</text>
    <text x="460" y="22" fill="#fff" font-size="11" text-anchor="middle" opacity="0.7">enc…</text>
    <text x="606" y="22" fill="#8b949e" font-size="12">frame N+1 waits → 59 ms/frame</text>
  </g>

  <!-- PIPELINED -->
  <text x="40" y="232" fill="#3fb950" font-size="15" font-weight="700">PIPELINED — three threads run concurrently (3.0× real-time)</text>

  <g transform="translate(40,250)">
    <!-- encoder lane -->
    <text x="-2" y="20" fill="#388bfd" font-size="12" font-weight="700">encoder thread (CPU)</text>
    <rect x="150" y="4"  width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="224" y="4"  width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="298" y="4"  width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="372" y="4"  width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="446" y="4"  width="70" height="26" rx="5" fill="url(#cpu)" opacity="0.6"/>
    <text x="455" y="22" fill="#c9d1d9" font-size="11" text-anchor="middle">runs ahead →</text>

    <!-- LM lane -->
    <text x="-2" y="62" fill="#db61ff" font-size="12" font-weight="700">main thread (GPU LM)</text>
    <rect x="224" y="46" width="70" height="26" rx="5" fill="url(#gpu)"/>
    <rect x="298" y="46" width="70" height="26" rx="5" fill="url(#gpu)"/>
    <rect x="372" y="46" width="70" height="26" rx="5" fill="url(#gpu)"/>
    <rect x="446" y="46" width="70" height="26" rx="5" fill="url(#gpu)"/>
    <text x="490" y="64" fill="#c9d1d9" font-size="11" text-anchor="middle">~27 ms floor</text>

    <!-- decoder lane -->
    <text x="-2" y="104" fill="#388bfd" font-size="12" font-weight="700">decoder thread (CPU)</text>
    <rect x="298" y="88" width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="372" y="88" width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="446" y="88" width="70" height="26" rx="5" fill="url(#cpu)"/>
    <rect x="520" y="88" width="70" height="26" rx="5" fill="url(#cpu)" opacity="0.6"/>

    <!-- queue arrows -->
    <line x1="259" y1="32" x2="259" y2="44" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="333" y1="74" x2="333" y2="86" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="600" y="40" fill="#8b949e" font-size="11">FIFO queue (enc → LM)</text>
    <text x="600" y="104" fill="#8b949e" font-size="11">FIFO queue (LM → dec)</text>
  </g>

  <!-- footer metrics -->
  <g transform="translate(40,400)">
    <rect x="0" y="0" width="270" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="32" fill="#8b949e" font-size="13">Throughput</text>
    <text x="20" y="64" fill="#3fb950" font-size="26" font-weight="700">16.9 → 37.5 frames/s</text>
    <text x="20" y="82" fill="#8b949e" font-size="12">1.35× → 3.0× real-time · 2.2× faster</text>

    <rect x="290" y="0" width="250" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="310" y="32" fill="#8b949e" font-size="13">4-bit LM weights</text>
    <text x="310" y="64" fill="#388bfd" font-size="26" font-weight="700">5.8 GB → 2.2 GB</text>
    <text x="310" y="82" fill="#8b949e" font-size="12">578 layers quantized · q4 gs32</text>

    <rect x="560" y="0" width="280" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="580" y="32" fill="#8b949e" font-size="13">vs. PyTorch / MPS baseline</text>
    <text x="580" y="64" fill="#db61ff" font-size="26" font-weight="700">0.7× → 3.0× RT</text>
    <text x="580" y="82" fill="#8b949e" font-size="12">~4× faster on the same M4 Pro</text>
  </g>
</svg>
